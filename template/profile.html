<html>
    <head>
        <title>skilled hands:profile</title>
    </head>
    <style>
        body {
    background-color: #f9f9fa
}

.padding {
    padding: 3rem !important
}

.user-card-full {
    overflow: hidden
}

.card {
    border-radius: 10px;
    -webkit-box-shadow: 0 1px 20px 0 rgba(69, 90, 100, 0.08);
    box-shadow: 0 1px 20px 0 rgba(69, 90, 100, 0.08);
    border: none;
    margin-bottom: 60px
}

.m-r-0 {
    margin-right: 0px
}

.m-l-0 {
    margin-left: 0px
}

.user-card-full .user-profile {
    border-radius: 5px 0 0 5px
}

.bg-c-lite-green {
    background: -webkit-gradient(linear, left top, right top, from(#f29263), to(#ee5a6f));
    background: linear-gradient(to right, #ee5a6f, #f29263)
}

.user-profile {
    padding: 10px 0
}

.card-block {
    padding: 1.25rem
}

.m-b-25 {
    margin-bottom: 25px
}

.img-radius {
    border-radius: 5px
}

h6 {
    font-size: 14px
}

.card .card-block p {
    line-height: 25px
}

@media only screen and (min-width: 1400px) {
    p {
        font-size: 14px
    }
}

.card-block {
    padding: .25rem
}

.b-b-default {
    border-bottom: 1px solid #e0e0e0
}
button:focus {
        -moz-box-shadow: none !important;
        -webkit-box-shadow: none !important;
        box-shadow: none !important;
        outline-width: 0
    }

.m-b-20 {
    margin-bottom: 20px
}

.p-b-5 {
    padding-bottom: 5px !important
}

.card .card-block p {
    line-height: 25px
}

.m-b-10 {
    margin-bottom: 10px
}

.text-muted {
    color: #919aa3 !important
}

.b-b-default {
    border-bottom: 1px solid #e0e0e0
}

.f-w-600 {
    font-weight: 600
}

.m-b-20 {
    margin-bottom: 20px
}

.m-t-40 {
    margin-top: 20px
}

.p-b-5 {
    padding-bottom: 5px !important
}

.m-b-10 {
    margin-bottom: 10px
}

.m-t-40 {
    margin-top: 20px
}

.user-card-full .social-link li {
    display: inline-block
}

.user-card-full .social-link li a {
    font-size: 20px;
    margin: 0 10px 0 0;
    -webkit-transition: all 0.3s ease-in-out;
    transition: all 0.3s ease-in-out
}
    </style>
    <body>
        <div class="page-content page-container" id="page-content">
            <div class="padding">
                <div class="row container d-flex justify-content-center">
                    <a class="home-link" href='{% url "index" %}' title="Cleaning" rel="home" padding="25px">
                        <img id="logo-img" class="img-center" src='{% static "images/favicon.png" %}' alt="logo-img"  height="75px" width="65"><br><h3>Skilled Hands</h3>
                    </a>
                    <div class="col-xl-6 col-md-12">
                        <div class="card user-card-full">
                            <div class="row m-l-0 m-r-0">
                                <div class="col-sm-4 bg-c-lite-green user-profile">
                                    <div class="card-block text-center text-white">
                                        <div class="m-b-25"> <img src= "{{ data.pfp.url }}" class="img-radius" alt="User-Profile-Image" height="100px" width="=50px"> </div>
                                        <h2 class="f-w-600"> </h2>
                                        <h3 class="f-w-600">{{ user.first_name }} {{user.last_name}}</h3>
                                        <p></p> <i class=" mdi mdi-square-edit-outline feather icon-edit m-t-10 f-16"></i>
                                    </div>
                                </div>
                                <div class="col-sm-8">
                                    <div class="card-block">
                                        <h6 class="m-b-20 p-b-5 b-b-default f-w-600">Information</h6>
                                        <div class="row">
                                            <div class="col-sm-6">
                                                <p class="m-b-10 f-w-600">Email</p>
                                                <h6 class="text-muted f-w-400">{{ user.email }}</h6>
                                            </div>
                                            <div class="col-sm-6">
                                                <p class="m-b-10 f-w-600">Phone</p>
                                                <h6 class="text-muted f-w-400">{{ data.cont_no }}</h6>
                                            </div>
                                        </div>
                                        <h6 class="m-b-20 m-t-40 p-b-5 b-b-default f-w-600">Details</h6>
                                        <div class="row">
                                            <div class="col-sm-6">
                                                <p class="m-b-10 f-w-600">address</p>
                                                <h6 class="text-muted f-w-400">{{data.add}}</h6>
                                            </div>
                                            <div class="col-sm-6">
                                                <p class="m-b-10 f-w-600">State</p>
                                                <h6 class="text-muted f-w-400">{{data.state}}</h6>
                                            </div>
                                            <div class="col-sm-6">
                                                <p class="m-b-10 f-w-600">Gender</p>
                                                <h6 class="text-muted f-w-400">{{data.gender}}</h6>
                                                <hr>
                                            </div>
                                            <div class="row justify-content-center my-3 px-3">
                                            <div class="mt-5 text-center"><button class="btn btn-primary profile-button" type="button"><a href="{% url 'logout' %}">Logout </a></button></div><br>
                                            <div class="mt-5 text-center"><button class="btn btn-primary profile-button" type="button"><a href="{% url 'update_profile' %}">Update Profile </a></button></div>
                                        </div>
                                        </div>
                                        
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    {% if user.is_superuser %}
            <h1 class="jumbotron my-3">YOU ARE NOT ALLOWED HERE</h1>
            {% else %}
                    <div class="col-md-6">
                     
                        <form action="{% url 'rating' %}" method="POST">
                            <select>
                                {% for i in ser %}
                                <option value="{{i.id}}" style="padding-top: 20px;">{{i.name}}</option>
                                {% endfor %}
                                </select>
                            <select name="service" >
                                <option value="1" style="padding-top: 40px;">Worst</option>
                                <option value="2" style="padding-top: 40px;">Bad</option>
                                <option value="3" style="padding-top: 40px;">Good</option>
                                <option value="4" style="padding-top: 40px;">Very Good</option>
                                <option value="5" style="padding-top: 40px;">Excellent</option>
                            </select>
                        
                    </form>
                  
                    </div>
                    {% endif %}
                    
                </div>
            </div>
        </div>
    </body>
</html>
