<html>
    <head>
        <title>
            SkilledHands:LOGIN
        </title>
    </head>
<style>
    body {
        color: #000;
        overflow-x: hidden;
        height: 100%;
        background-image: linear-gradient(to right, #e6ebf0, #26648a);
        background-repeat: no-repeat
    }

    input,
    textarea {

        background-color: #F3E5F5;
        border-radius: 50px !important;
        padding: 12px 15px 12px 15px !important;
        width: 100%;
        box-sizing: border-box;
        border: none !important;
        border: 1px solid #F3E5F5 !important;
        font-size: 16px !important;
        color: #000 !important;
        font-weight: 400
    }

    input:focus,
    textarea:focus {
        -moz-box-shadow: none !important;
        -webkit-box-shadow: none !important;
        box-shadow: none !important;
        border: 1px solid #D500F9 !important;
        outline-width: 0;
        font-weight: 400
    }

    button:focus {
        -moz-box-shadow: none !important;
        -webkit-box-shadow: none !important;
        box-shadow: none !important;
        outline-width: 0
    }

    .card {
        border-radius: 0;
        border: none
    }

    .card1 {
        width: 50%;
        padding: 40px 30px 10px 30px
    }

    .card2 {
        width: 50%;
        background-image: linear-gradient(to right, #4fc7ff, #0011f9)
    }


    .heading {
        margin-bottom: 60px !important
    }

    ::placeholder {
        color: #000 !important;
        opacity: 1
    }

    :-ms-input-placeholder {
        color: #000 !important
    }

    ::-ms-input-placeholder {
        color: #000 !important
    }

    .form-control-label {
        font-size: 12px;
        margin-left: 15px
    }

    .msg-info {
        padding-left: 15px;
        margin-bottom: 30px
    }

    .btn-color {
        border-radius: 50px;
        color: #fff;
        background-image: linear-gradient(to right, #232ed3, #ddee47);
        padding: 15px;
        cursor: pointer;
        border: none !important;
        margin-top: 40px
    }

    .btn-color:hover {
        color: #fff;
        background-image: linear-gradient(to right, #ecea56, #5d2bd1)
    }

    .btn-white {
        border-radius: 50px;
        color: #D500F9;
        background-color: #fff;
        padding: 8px 40px;
        cursor: pointer;
        border: 2px solid #D500F9 !important
    }

    .btn-white:hover {
        color: #fff;
        background-image: linear-gradient(to right, #FFD54F, #D500F9)
    }

    a {
        color: #000
    }

    a:hover {
        color: #000
    }

    .bottom {
        width: 100%;
        margin-top: 50px !important
    }

    .sm-text {
        font-size: 15px
    }

    @media screen and (max-width: 992px) {
        .card1 {
            width: 100%;
            padding: 40px 30px 10px 30px
        }

        .card2 {
            width: 100%
        }

        .right {
            margin-top: 100px !important;
            margin-bottom: 100px !important
        }
    }

    @media screen and (max-width: 768px) {
        .container {
            padding: 10px !important
        }

        .card2 {
            padding: 50px
        }

        .right {
            margin-top: 50px !important;
            margin-bottom: 50px !important
        }
    }
</style>
<body>
<form method="post" action='{% url "login" %}' id="contact-form">
    <center>
    {% csrf_token %}
    <div class="container px-4 py-5 mx-auto">
        <div class="card card0">
            <div class="d-flex flex-lg-row flex-column-reverse">
                <div class="card card1">
                    <div class="row justify-content-center my-auto">
                        <div class="col-md-8 col-10 my-5">
                            <div class="row justify-content-center px-3 mb-3"> </div>
                            <a href='{% url "index" %}'><img id="logo-img" class="img-center" src="\static\images\favicon.png" height="75px" width="65" alt="logo-img"><br><h3 style="color:black">Skilled Hands</h3></a>
                            <h4 class="msg-info">Please login to your account</h4>
                            
                                <input type="text" name="user_name" placeholder="Username" class="form-control">
                            </div>
                            <div class="form-group"> <label class="form-control-label text-muted"></label><br>
                                <input type="password" name="password" placeholder="Password" class="form-control">
                            </div>
                            <div class="row justify-content-center my-3 px-3">
                                <button class="btn-block btn-color">Login</button><hr><br>
                            </div>
                            <!--<div class="row justify-content-center my-2"> <a href="#"><small class="text-muted">Forgot
                                        Password?</small></a> </div>--><br>
                            <div class="row justify-content-center my-2"> <a href='{% url "reg" %}'><small class="text-muted">Don't 
                                            have an account? Register</small></a> </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    </div>
    </center>
</form>
</body>
</html>
